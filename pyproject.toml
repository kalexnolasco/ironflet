[project]
name = "ironflet"
version = "0.2.0"
description = "English-only weight-training tracker built with Flet — runs on Android, desktop and web from a single Python codebase."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Alex Nolasco", email = "kalex.nolasco@gmail.com" }]
keywords = [
    "fitness",
    "workout",
    "tracker",
    "gym",
    "flet",
    "flutter",
    "android",
    "mobile",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: Android",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    # flet[all], not plain flet: the web mode needs flet-web, and without the
    # extra declared here a bare `uv sync` uninstalls it and takes the
    # vendored CanvasKit with it. Web is the only mode actually deployed.
    "flet[all]>=0.25,<0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/kalexnolasco/ironflet"
Repository = "https://github.com/kalexnolasco/ironflet"
Issues = "https://github.com/kalexnolasco/ironflet/issues"
Changelog = "https://github.com/kalexnolasco/ironflet/blob/main/CHANGELOG.md"
Releases = "https://github.com/kalexnolasco/ironflet/releases"

[tool.flet]
app.module = "main"

# Must match theme.py: LIGHT.bg_page / DARK.bg_page. LIGHT is the default
# palette, so a splash painted in the dark background flashed black before the
# first light frame. These two keys are the only ones flet reads for the splash
# (per platform it looks at tool.flet.<platform>.splash.color, then falls back
# here) — a flat `splash_color` under [tool.flet.android] is never read.
[tool.flet.splash]
color = "#F4F6F8"
dark_color = "#0A0A0B"

[tool.flet.android]
package_name = "com.ironflet.app"
product_name = "IronFlet"
# Launcher-icon background layer, not the splash: it shows on the home screen
# against the wallpaper, so it does not follow the app's page background.
adaptive_icon_background = "#0A0A0B"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["exercise_details.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
